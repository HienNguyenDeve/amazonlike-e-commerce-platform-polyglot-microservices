spring.application.name=auth-service
server.port=8085

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info

# Database configuration
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${AUTH_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jwt Configuration
app.security.secretKey=${ACCESS_TOKEN_SECRET_KEY}
app.security.accessTokenExpiration=3600000
app.security.refreshTokenExpiration=604800000

# Frontend Configuration
app.frontend.url=${REACT_APP_URL}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_HOST}:${KAFKA_PORT}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# logging.level.org.apache.kafka=DEBUG
# logging.level.org.springframework.kafka=DEBUG