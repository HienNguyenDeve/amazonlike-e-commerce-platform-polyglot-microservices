# 1. Thông tin định danh dự án trên SonarQube
sonar.projectKey=amazonlike-microservices
sonar.projectName=AmazonLike Ecommerce Platform
sonar.projectVersion=1.0.0

# 2. Vị trí mã nguồn và mã kiểm thử (Tính từ thư mục gốc dự án)
# Để dấu chấm (.) để SonarQube tự quét toàn bộ dự án bao gồm cả shared, api-gateway, auth-service, product-service
sonar.sources=api-gateway,auth-service,product-service,shared
sonar.tests=api-gateway,auth-service,product-service,shared

# Chỉ định quét các file trong thư mục src chính của Java
sonar.inclusions=**/src/main/java/**
sonar.test.inclusions=**/src/test/java/**

# 3. Đường dẫn cấu hình file biên dịch (Bắt buộc cho dự án Java)
sonar.java.binaries=**/target/classes

# 4. Đường dẫn file báo cáo độ bao phủ Test của JaCoCo
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

# 5. Loại trừ các file tự sinh hoặc cấu hình để điểm số SonarQube không bị loãng
sonar.exclusions=**/mappers/**,**/dto/**,**/models/**,**/config/**,**/*Application.java
